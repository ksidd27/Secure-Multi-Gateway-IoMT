global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend kong_frontend
    bind *:8080
    default_backend kong_backends

backend kong_backends
    balance roundrobin
    option httpchk GET /edgex-data/api/v1/ping
    http-check expect status 401
    server kong1 kong:8000 check inter 3s fall 3 rise 2
    server kong2 kong-2:8000 check inter 3s fall 3 rise 2
